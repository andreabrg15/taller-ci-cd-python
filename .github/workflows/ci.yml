name: CI - Calidad y pruebas en jobs separados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7
      - name: Preparar Python 3.12.6
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.6'
      - name: Instalar Ruff
        run: python -m pip install ruff==0.9.4
      - name: Analizar el codigo
        run: ruff check .

  tests:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Descargar el codigo otra vez (runner nuevo)
        uses: actions/checkout@v7
      - name: Preparar Python 3.12.6 y cache
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.6'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar herramientas
        run: python -m pip install -r requirements.txt
      - name: Ejecutar pytest y verificar 80 por ciento de cobertura
        run: |
          python -m pytest -q \
            --cov=calculadora \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            --junitxml=reportes/junit.xml
      - name: Conservar reportes incluso si falla pytest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage.xml
            reportes/junit.xml
          if-no-files-found: warn
          retention-days: 1

 