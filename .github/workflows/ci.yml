name: CI - Python 

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Python exacto con cache de pip
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.6'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar herramientas
        run: python -m pip install -r requirements.txt

      - name: Analisis estatico
        run: ruff check .

      - name: Pruebas y cobertura (minimo 80 por ciento)
        run: |
          python -m pytest -q \
            --cov=calculadora \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            --junitxml=reportes/junit.xml

      - name: Adjuntar reportes aunque fallen las pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage.xml
            reportes/junit.xml
          if-no-files-found: warn
          retention-days: 1
 